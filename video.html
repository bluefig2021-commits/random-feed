<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRIVATE TV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      font-family: Arial, sans-serif;
      color: #222;
      background: #fff;
    }
    .frame {
      max-width: 520px;
      margin: 0 auto;
    }
    #loginView {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #loginError {
      color: #e33;
      font-size: 13px;
      text-align: center;
      overflow-wrap: anywhere;
    }
    button {
      cursor: pointer;
      font: inherit;
    }
    .black {
      border: 0;
      border-radius: 24px;
      background: #111;
      color: white;
      padding: 12px 24px;
    }
    #app[hidden], #loginView[hidden] {
      display: none !important;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h1 { font-size: 24px; margin: 0; }
    #channels {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 6px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    #channels::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      white-space: nowrap;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: white;
      padding: 6px 12px;
    }
    .chip.active {
      background: #111;
      color: white;
    }
    /* 플레이어: 화면 높이에 맞춰 작게, 가운데 정렬 */
    .stage {
      --h: clamp(320px, calc(100dvh - 215px), 640px);
      position: relative;
      height: var(--h);
      width: calc(var(--h) * 9 / 16);
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
    }
    /* iframe을 위아래로 크게 키워서 유튜브 제목/버튼이 잘려 보이지 않게 함 */
    #videoFrame {
      position: absolute;
      left: 0;
      top: -80px;
      width: 100%;
      height: calc(100% + 160px);
      border: 0;
    }
    /* 투명 터치층: 탭=일시정지/소리켜기, 위로 스와이프=다음, 아래로=이전 */
    #tapLayer {
      position: absolute;
      inset: 0;
      z-index: 2;
      touch-action: none;
      cursor: pointer;
    }
    #soundHint {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 3;
      background: rgba(0, 0, 0, .65);
      color: #fff;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 16px;
      pointer-events: none;
      white-space: nowrap;
    }
    #soundHint[hidden] { display: none; }
    #videoTitle, #videoMeta { display: none; }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }
    .controls button { padding: 10px 15px; }
    #status {
      text-align: center;
      font-size: 13px;
      color: #777;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="frame">

    <section id="loginView">
      <div style="letter-spacing:4px;color:#999;font-size:12px">
        PRIVATE TV
      </div>

      <button id="googleLoginBtn" class="black" type="button">
        GOOGLE LOGIN
      </button>

      <div id="loginError" role="alert"></div>
    </section>

    <section id="app" hidden>
      <header>
        <h1>TV</h1>
        <button id="logoutBtn" type="button">LOGOUT</button>
      </header>

      <nav id="channels"></nav>

      <div class="stage">
        <iframe
          id="videoFrame"
          title="영상 플레이어"
          allow="autoplay; encrypted-media; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
        <div id="tapLayer"></div>
        <div id="soundHint" hidden>🔇 화면을 탭하면 소리 켜짐</div>
      </div>

      <div id="videoTitle"></div>
      <div id="videoMeta"></div>

      <div class="controls">
        <button id="prevBtn" type="button">← 이전</button>
        <button id="randomBtn" class="black" type="button">RANDOM</button>
        <button id="nextBtn" type="button">다음 →</button>
      </div>

      <p id="status" aria-live="polite"></p>
    </section>

  </main>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 관리자 구글 이메일
    const ADMIN_EMAIL = "raizn199x@gmail.com";

    // 기존 Firebase 프로젝트 설정
    const firebaseConfig = {
      apiKey: "AIzaSyDWYC-g2LwKA10RUXYB2_5vXNULAcbUVFo",
      authDomain: "memo-9d3d7.firebaseapp.com",
      projectId: "memo-9d3d7",
      storageBucket: "memo-9d3d7.firebasestorage.app",
      messagingSenderId: "648840817270",
      appId: "1:648840817270:web:77b3b3b7dfa3b67441cd57",
      measurementId: "G-WVEF9DQ4M4"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });

    setPersistence(auth, browserLocalPersistence).catch(console.error);

    const $ = id => document.getElementById(id);

    // 구글 로그인
    $("googleLoginBtn").addEventListener("click", async () => {
      const button = $("googleLoginBtn");
      const error = $("loginError");

      error.textContent = "";
      button.disabled = true;
      button.textContent = "로그인 중...";

      try {
        const result = await signInWithPopup(auth, provider);

        if (result.user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
          await signOut(auth);
          error.textContent = "관리자 계정으로 로그인해 줘.";
        }
      } catch (e) {
        console.error("Google login error:", e);

        const messages = {
          "auth/popup-blocked": "팝업이 차단됐어. 브라우저에서 팝업을 허용해 줘.",
          "auth/popup-closed-by-user": "로그인 창이 닫혔어. 다시 시도해 줘.",
          "auth/unauthorized-domain": "Firebase에서 이 사이트 도메인을 승인해야 해.",
          "auth/operation-not-allowed": "Firebase에서 Google 로그인을 활성화해야 해.",
          "auth/network-request-failed": "네트워크 연결을 확인해 줘."
        };

        error.textContent =
          messages[e.code] ||
          `로그인 오류: ${e.code || e.message}`;
      } finally {
        button.disabled = false;
        button.textContent = "GOOGLE LOGIN";
      }
    });

    // 로그인 상태 및 관리자 권한 확인
    onAuthStateChanged(auth, async user => {
      if (!user) {
        $("loginView").hidden = false;
        $("app").hidden = true;
        return;
      }

      if (user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        $("loginError").textContent = "관리자 계정만 이용할 수 있어.";
        $("loginView").hidden = false;
        $("app").hidden = true;
        await signOut(auth);
        return;
      }

      $("loginError").textContent = "";
      $("loginView").hidden = true;
      $("app").hidden = false;

      await loadVideos();
    });

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (e) {
        $("status").textContent = "로그아웃 오류: " + e.message;
      }
    });

    // 영상 데이터
    let videos = [];
    let filteredVideos = [];
    let currentIndex = -1;
    let currentCategory = "전체";
    let loaded = false;

    async function loadVideos() {
      if (loaded) return;
      loaded = true;

      try {
        const [videoResponse, linkResponse] = await Promise.all([
          fetch("./data/videos.json", { cache: "no-cache" }),
          fetch("./data/links.json", { cache: "no-cache" })
        ]);

        const videoData = videoResponse.ok
          ? await videoResponse.json()
          : [];

        const linkData = linkResponse.ok
          ? await linkResponse.json()
          : [];

        videos = [
          ...(Array.isArray(videoData) ? videoData : [])
            .filter(v => v && /^[\w-]{11}$/.test(v.id || ""))
            .map(v => ({
              id: v.id,
              title: v.t || "제목 없음",
              category: v.c || "기타",
              url: `https://www.youtube.com/embed/${v.id}`
            })),

          ...(Array.isArray(linkData) ? linkData : [])
            .filter(v => v && /^https:\/\/(www\.)?youtube\.com\/watch/.test(v.url || ""))
            .map(v => {
              const url = new URL(v.url);
              const id = url.searchParams.get("v");

              return {
                id,
                title: v.t || "제목 없음",
                category: v.c || "내 링크",
                url: id && /^[\w-]{11}$/.test(id)
                  ? `https://www.youtube.com/embed/${id}`
                  : ""
              };
            })
            .filter(v => v.url)
        ];

        videos = [...new Map(videos.map(v => [v.id, v])).values()];

        renderChannels();
        applyFilter();
      } catch (e) {
        console.error("load error:", e);
        loaded = false;
        $("status").textContent = "영상 불러오기 오류: " + e.message;
      }
    }

    // 카테고리 버튼
    function renderChannels() {
      const cats = ["전체", ...new Set(videos.map(v => v.category))];
      const nav = $("channels");
      nav.innerHTML = "";

      cats.forEach(cat => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (cat === currentCategory ? " active" : "");
        b.textContent = cat;
        b.addEventListener("click", () => {
          currentCategory = cat;
          renderChannels();
          applyFilter();
        });
        nav.appendChild(b);
      });
    }

    // 카테고리 필터 적용
    function applyFilter() {
      filteredVideos = currentCategory === "전체"
        ? videos.slice()
        : videos.filter(v => v.category === currentCategory);

      if (!filteredVideos.length) {
        currentIndex = -1;
        $("videoFrame").removeAttribute("src");
        $("videoTitle").textContent = "";
        $("videoMeta").textContent = "";
        $("status").textContent = "영상이 아직 없어. (data/videos.json 이 비어 있음)";
        return;
      }

      playRandom();
    }

    // 재생
    function playIndex(i) {
      const n = filteredVideos.length;
      if (!n) return;

      currentIndex = ((i % n) + n) % n;
      const v = filteredVideos[currentIndex];

      // 처음엔 소리 없이 자동재생(브라우저 규칙), 한 번 터치한 뒤부턴 소리 켜진 채 자동재생
      curMuted = !userInteracted;
      const q = new URLSearchParams({
        autoplay: 1, mute: curMuted ? 1 : 0, controls: 0, modestbranding: 1,
        rel: 0, playsinline: 1, iv_load_policy: 3, fs: 0, disablekb: 1,
        loop: 1, playlist: v.id, enablejsapi: 1, origin: location.origin
      });
      $("videoFrame").src = v.url + "?" + q.toString();
      paused = false;
      $("soundHint").hidden = !curMuted;
      $("videoTitle").textContent = v.title;
      $("videoMeta").textContent = v.category;
      $("status").textContent = `${currentIndex + 1} / ${n}`;
    }

    function playRandom() {
      const n = filteredVideos.length;
      if (!n) return;

      let i = Math.floor(Math.random() * n);
      if (n > 1 && i === currentIndex) i = (i + 1) % n;
      playIndex(i);
    }

    // ---- 틱톡식 조작 ----
    let userInteracted = false;  // 앱 화면을 한 번이라도 터치했는지
    let curMuted = true;         // 지금 영상이 음소거로 시작했는지
    let paused = false;

    function ytCmd(func, args = []) {
      const w = $("videoFrame").contentWindow;
      if (w) w.postMessage(JSON.stringify({ event: "command", func, args }), "*");
    }

    function goNext() { playIndex(currentIndex + 1); }
    function goPrev() { playIndex(currentIndex - 1); }

    function onTap() {
      if (curMuted) {                 // 첫 탭: 소리 켜기
        ytCmd("unMute");
        ytCmd("setVolume", [100]);
        curMuted = false;
        $("soundHint").hidden = true;
      } else {                        // 이후 탭: 일시정지/재생
        paused = !paused;
        ytCmd(paused ? "pauseVideo" : "playVideo");
      }
    }

    ["pointerdown", "keydown"].forEach(ev =>
      $("app").addEventListener(ev, () => { userInteracted = true; }, true)
    );

    const tap = $("tapLayer");
    let sx = null, sy = null;
    tap.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
    tap.addEventListener("pointercancel", () => { sx = sy = null; });
    tap.addEventListener("pointerup", e => {
      if (sy === null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      sx = sy = null;
      if (Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx)) {
        dy < 0 ? goNext() : goPrev();   // 위로 밀면 다음
      } else {
        onTap();
      }
    });

    let wheelLock = false;
    tap.addEventListener("wheel", e => {
      e.preventDefault();
      if (wheelLock) return;
      wheelLock = true;
      setTimeout(() => { wheelLock = false; }, 600);
      e.deltaY > 0 ? goNext() : goPrev();
    }, { passive: false });

    document.addEventListener("keydown", e => {
      if ($("app").hidden) return;
      if (e.key === "ArrowDown") { e.preventDefault(); goNext(); }
      if (e.key === "ArrowUp") { e.preventDefault(); goPrev(); }
    });

    $("randomBtn").addEventListener("click", playRandom);
    $("prevBtn").addEventListener("click", goPrev);
    $("nextBtn").addEventListener("click", goNext);
  </script>
</body>
</html>
