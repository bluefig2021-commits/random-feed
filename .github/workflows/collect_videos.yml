name: collect-videos
on:
  schedule:
    - cron: "0 3 * * *"     # 하루 한 번 (한국 시간 낮 12시)
  workflow_dispatch:         # 수동 실행 버튼
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collect videos
        run: python scripts/collect_videos.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: commit
        run: |
          git config user.name "collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || (git commit -m "collect: new videos" && git push)
